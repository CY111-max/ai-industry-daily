name: 每日资讯采集

on:
  schedule:
    # GitHub 的 schedule 是「尽力而为」，实测排队延迟 1.5~3.3 小时。
    # 所以每个批次提前埋三次兜底，先跑成的那次落盘，后面几次发现无新增就不提交。
    #
    # 早批 → 北京 09:00（下列时刻为北京 06:40 / 07:40 / 08:40）
    - cron: '40 22 * * *'
    - cron: '40 23 * * *'
    - cron: '40 0 * * *'
    # 晚批 → 北京 21:00（下列时刻为北京 18:40 / 19:40 / 20:40）
    - cron: '40 10 * * *'
    - cron: '40 11 * * *'
    - cron: '40 12 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '指定日期（YYYY-MM-DD，留空=今天，北京时间）'
        required: false
      dry_run:
        description: '只抓取不调用大模型（跳过摘要与简报）'
        type: boolean
        default: false

# 多次运行会写同一批 data/ 文件，必须串行；排队而不是取消，避免写坏半个结果
concurrency:
  group: collector
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 采集 + 生成摘要与简报
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          # 批次由「哪个 cron 触发」决定，而不是运行时刻：
          # 既然排期本身会延迟 1~3 小时，用墙上时间推断就会把早批错写成晚批。
          SLOT=""
          case "${{ github.event.schedule }}" in
            "40 22 * * *"|"40 23 * * *"|"40 0 * * *")  SLOT="--slot=0900" ;;
            "40 10 * * *"|"40 11 * * *"|"40 12 * * *") SLOT="--slot=2100" ;;
          esac
          ARGS="$SLOT"
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date=${{ inputs.date }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          echo "运行参数：$ARGS"
          node collector/run.js $ARGS

      - name: 提交数据
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "无数据变化，跳过提交"
            exit 0
          fi
          git commit -m "data: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M') 更新"
          # 本机（VS Code）也可能同时推了提交，先 rebase 再推一次
          git push || { git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; }
